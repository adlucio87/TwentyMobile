<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TwentyMobile Authorization</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f1115;
      color: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #181b20;
      border: 1px solid #282c34;
      border-radius: 18px;
      padding: 36px 28px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }
    .logo-container {
      margin-bottom: 20px;
    }
    .badge {
      display: inline-block;
      width: 52px;
      height: 52px;
      line-height: 52px;
      border-radius: 14px;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      font-size: 24px;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
    }
    p {
      margin: 0 0 24px;
      font-size: 14px;
      line-height: 1.5;
      color: #9ca3af;
    }
    .btn {
      display: inline-block;
      background: #2563eb;
      color: #ffffff;
      padding: 13px 28px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .spinner {
      margin: 0 auto 20px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <div class="badge">20</div>
    </div>
    <div class="spinner" id="spinner"></div>
    <h2>Authorization Complete</h2>
    <p id="status-text">Redirecting to TwentyMobile...</p>
    <a id="open-app-btn" class="btn" href="#">Open TwentyMobile</a>
  </div>

  <script>
    (function () {
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      var query = search + (hash ? (search ? '&' : '?') + hash.substring(1) : '');
      var customSchemeUrl = 'pocketcrm://oauth/callback' + query;

      var btn = document.getElementById('open-app-btn');
      if (btn) {
        btn.href = customSchemeUrl;
      }

      // Immediate redirect to custom scheme
      try {
        window.location.replace(customSchemeUrl);
      } catch (e) {
        window.location.href = customSchemeUrl;
      }

      // Fallback message if browser stays on page
      setTimeout(function () {
        var status = document.getElementById('status-text');
        if (status) {
          status.innerText = "If TwentyMobile did not open automatically, tap the button below:";
        }
      }, 1500);
    })();
  </script>
</body>
</html>
